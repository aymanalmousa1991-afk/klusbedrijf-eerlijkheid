# fly.toml voor Klusbedrijf Eerlijkheid Backend
app = "klusbedrijf-eerlijkheid-api"
primary_region = "fra"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

# Geen add-ons (geen Tigris, geen Postgres — we gebruiken MongoDB Atlas)
